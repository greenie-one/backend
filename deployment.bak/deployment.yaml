apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenie-mvp-backend-dev
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-dev
  template:
    metadata:
      labels:
        app: backend-dev
    spec:
      containers:
        - name: greenie-backend
          image: ghcr.io/greenie-one/backend
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: {{ .Values.APP_ENV }}
    
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-{{ .Values.APP_ENV }}-key
                  key: private

            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-{{ .Values.APP_ENV }}-key
                  key: public

            - name: JWT_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: jwt-{{ .Values.APP_ENV }}-key
                  key: passphrase
          livenessProbe:
            httpGet:
              path: /health-check
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 900
